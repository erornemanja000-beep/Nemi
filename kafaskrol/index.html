        <h2>Grind</h2>
        <p>It all starts with a whole bean. We roast twice a week in Vienna and grind to order: for espresso, filter, French press or moka pot. Or keep it whole and grind it fresh at home.</p>
        <h2>Pour</h2>
        <p>Pour-over takes its time: 18 g of coffee, water at 93 °C, three minutes. Let it bloom, pour in slow circles, then wait for the last drop. Our guide walks you through it.</p>
        <h2>Sip</h2>
        <p>Fruity, chocolaty or somewhere in between? Find your cup by origin, flavor or roast: from a floral Ethiopian to our house espresso. Every bag shows its roast date.</p>
