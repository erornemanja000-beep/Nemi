# Nemi Studio on Netlify. In the Netlify UI set "Base directory" to: nemi
# The build downloads the photos (self-hosted, GDPR friendly) and writes dist/.
[build]
  command = "python3 fetch_images.py; python3 build.py"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
