# Netlify: objavljuje kinematic/dist (statičke stranice, bez build koraka).
# Novi sajt na Netlify-ju: Add new site → Import an existing project → GitHub →
# ovaj repo i grana, a pod "Base directory" upiši: kinematic
[build]
  publish = "dist"
  command = "echo 'Static site - no build step'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
